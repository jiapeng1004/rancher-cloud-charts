{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rest.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rest.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "rest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rest.selectorLabels" . | nindent 8 }}
      {{- with .Values.deployment.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rest.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.deployment.automountServiceAccountToken }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        - name: init-db
          image: "{{ .Values.initDbImage.repository }}:{{ .Values.initDbImage.tag }}"
          imagePullPolicy: {{ .Values.initDbImage.pullPolicy }}
          env:
            {{- if .Values.dbHost }}
            - name: DB_HOST
              value: {{ .Values.dbHost | quote }}
            {{- end }}
            {{- if .Values.dbPort }}
            - name: DB_PORT
              value: {{ .Values.dbPort | quote }}
            {{- end }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              until pg_isready -h $(DB_HOST) -p $(DB_PORT) -U postgres; do
              echo "Waiting for database to start..."
              sleep 2
              done
            - echo "Database is ready"
      containers:
        - name: {{ include "rest.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DB_USER
              value: {{ .Values.environment.DB_USER | quote }}
            - name: DB_DRIVER
              value: {{ .Values.environment.DB_DRIVER | quote }}
            - name: DB_SSL
              value: {{ .Values.environment.DB_SSL | quote }}
            - name: PGRST_DB_SCHEMAS
              value: {{ .Values.environment.PGRST_DB_SCHEMAS | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.environment.PGRST_DB_ANON_ROLE | quote }}
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: {{ .Values.environment.PGRST_DB_USE_LEGACY_GUCS | quote }}
            - name: PGRST_APP_SETTINGS_JWT_EXP
              value: {{ .Values.environment.PGRST_APP_SETTINGS_JWT_EXP | quote }}
            {{- if .Values.dbHost }}
            - name: DB_HOST
              value: {{ .Values.dbHost | quote }}
            {{- end }}
            {{- if .Values.dbPort }}
            - name: DB_PORT
              value: {{ .Values.dbPort | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-db
                  key: password
            - name: DB_PASSWORD_ENC
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-db
                  key: passwordEncoded
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-db
                  key: database
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-jwt
                  key: secret
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-jwt
                  key: secret
          {{- with .Values.deployment.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.volumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.lifecycle }}
          lifecycle: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml .Values.deployment.securityContext | nindent 12 }}
      {{- with .Values.deployment.volumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
