## Auth sub-chart values
enabled: true
replicaCount: 1

image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/gotrue
  pullPolicy: IfNotPresent
  tag: "v2.182.0"
  pullSecrets: []

initDbImage:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/codingpuss/postgres-client
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 9999
  targetPort: 9999
  protocol: TCP
  portName: http
  annotations: {}

environment:
  API_EXTERNAL_URL: http://localhost:8000
  GOTRUE_API_HOST: "0.0.0.0"
  GOTRUE_API_PORT: "9999"
  GOTRUE_DB_DRIVER: postgres
  GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:password@localhost:5432/postgres
  GOTRUE_SITE_URL: http://localhost:3000
  GOTRUE_URI_OPERATOR_PATH: /operator
  GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
  GOTRUE_JWT_ADMIN_ROLES: service_role
  GOTRUE_JWT_AUD: authenticated
  GOTRUE_JWT_EXP: "3600"
  GOTRUE_JWT_SECRET: ""
  GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
  GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
  GOTRUE_MAILER_AUTOCONFIRM: "true"
  GOTRUE_SMS_AUTOCONFIRM: "true"
  GOTRUE_SMTP_ADMIN_EMAIL: ""
  GOTRUE_SMTP_HOST: ""
  GOTRUE_SMTP_PORT: ""
  GOTRUE_SMTP_SENDER_NAME: ""
  GOTRUE_SMTP_PASS: ""
  GOTRUE_SMTP_USER: ""
  GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
  GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
  GOTRUE_RATE_LIMIT_EMAIL_SENT: "3600"
  GOTRUE_RATE_LIMIT_SMS_SENT: "3600"
  GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
  GOTRUE_RATE_LIMIT_VERIFY: "30"
  GOTRUE_RATE_LIMIT_LOGIN: "30"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

deployment:
  annotations: {}
  podAnnotations: {}
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  envFrom: []
  volumeMounts: []
  volumes: []
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  lifecycle: {}

# Cross-component references (explicit)
dbSecretRef: ""
dbHost: ""
dbPort: ""
dbName: ""
jwtSecretRef: ""
apikeySecretRef: ""
smtpSecretRef: ""
