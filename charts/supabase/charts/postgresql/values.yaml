image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/postgres
  tag: "15.8.1.085"
  pullPolicy: IfNotPresent

# 对齐官方 docker-compose 的 db 服务（command/init 卷挂载/JWT）；换 library postgres 时请设 composeMode: false
supabase:
  composeMode: true
  postgresqlCustomPersistence: false

serviceAccount:
  create: false
  name: ""

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

imagePullSecrets: []

# Pod 级 security。默认 runAsUser=105、runAsGroup=106、fsGroup=106；换镜像请 kubectl exec … id postgres 核对。
# seccompProfile：仅 K8s 1.22+；内嵌 Postgres deployment 会根据 Capabilities.KubeVersion 在旧集群剔除该字段。
podSecurityContext:
  fsGroup: 106
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 105
  runAsGroup: 106

service:
  type: ClusterIP
  port: 5432

postgresql:
  user: "postgres"
  password: "your-super-secret-and-long-postgres-password"
  database: "postgres"
  # 默认不写 PGDATA，与官方 postgres/supabase postgres 镜像及 compose 卷挂载一致；
  # 仅当你必须用非默认数据子目录时再填绝对路径。
  pgdata: ""

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  # storageClass: ""

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "2"

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: postgresql.example.com
      paths:
        - path: /
          pathType: Prefix
