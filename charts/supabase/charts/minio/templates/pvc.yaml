{{- if and .Values.enabled .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "minio.fullname" . }}-data
  labels: {{- include "minio.labels" . | nindent 4 }}
spec:
  {{- $sc := .Values.persistence.storageClassName | default .Values.global.defaultStorageClassName }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
