## Imgproxy sub-chart values
## All variables explicitly declared

enabled: true

replicaCount: 1

image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/darthsim/imgproxy
  pullPolicy: IfNotPresent
  tag: "v3.30.1"
  pullSecrets: []

service:
  type: ClusterIP
  port: 5001
  targetPort: 8080
  protocol: TCP
  portName: http
  annotations: {}

environment:
  IMGPROXY_BIND: ":5001"
  IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
  IMGPROXY_USE_ETAG: "true"
  IMGPROXY_ENABLE_WEBP_DETECTION: "true"

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

deployment:
  annotations: {}
  podAnnotations: {}
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  envFrom: []
  volumeMounts: []
  volumes: []
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  lifecycle: {}
