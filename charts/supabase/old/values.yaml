## Supabase Helm Chart Configuration (v2.0 - 显式化重构)
##
## 架构说明：
## - 所有组件已拆分为独立子 chart（supabase/charts/*）
## - 所有变量通过显式声明传递，不再使用隐式 range
## - 跨组件引用通过显式字段传递（如 dbHost, jwtSecretRef 等）
##
## 使用方式：
## 1. 配置全局 secrets（由父 chart 的 secret 模板生成）
## 2. 配置各子 chart 的显式参数
## 3. 配置跨组件引用（通过子 chart 的 xxxRef 字段）

## ============================================================================
## 全局配置
## ============================================================================

global:
  storageClassName: ""

## ============================================================================
## Secret 配置（与 questions.yaml 对齐）
## ============================================================================
## 这些值会被注入到集群 Secret 中，各子 chart 通过 secretRef 显式引用

