{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kong.fullname" . }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
data:
  kong.yml: |
{{ .Files.Get "files/kong.yml" | nindent 4 }}
  kong-entrypoint.sh: |
{{ .Files.Get "files/kong-entrypoint.sh" | nindent 4 }}
{{- end }}
