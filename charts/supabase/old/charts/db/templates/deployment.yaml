{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "db.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "db.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "db.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "db.selectorLabels" . | nindent 8 }}
      {{- with .Values.deployment.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "db.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.deployment.automountServiceAccountToken }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        - command:
            - sh
            - -c
            - |
              echo "Fixing ownership of /var/lib/postgresql/data to 105:106"
              chown -R 105:106 /var/lib/postgresql/data
              chmod -R 0750 /var/lib/postgresql/data
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/busybox:1.30.1
          imagePullPolicy: IfNotPresent
          name: fix-permissions
          resources: { }
          securityContext:
            runAsUser: 0
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
      containers:
        - name: {{ include "db.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - log_min_messages=fatal
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: /var/run/postgresql
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-db
                  key: password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-db
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-jwt
                  key: secret
            - name: JWT_EXP
              value: "3600"
            - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.fullname" . }}-analytics
                  key: publicAccessToken
          {{- with .Values.deployment.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.deployment.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            - mountPath: /var/lib/postgresql/data
              name: db-data
            - mountPath: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
              name: initdb-scripts-source
              subPath: 98-webhooks.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
              name: initdb-scripts-source
              subPath: 99-jwt.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
              name: initdb-scripts-source
              subPath: 99-roles.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
              name: initdb-scripts-source
              subPath: 97-_supabase.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
              name: initdb-scripts-source
              subPath: 99-realtime.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/migrations/99-logs.sql
              name: initdb-scripts-source
              subPath: 99-logs.sql
              readOnly: true
            - mountPath: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
              name: initdb-scripts-source
              subPath: 99-pooler.sql
              readOnly: true
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.lifecycle }}
          lifecycle: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml .Values.deployment.securityContext | nindent 12 }}
      volumes:
        - name: initdb-scripts
          emptyDir: {}
        - name: initdb-scripts-source
          configMap:
            name: {{ include "db.fullname" . }}-initdb
            defaultMode: 0755
        {{- with .Values.deployment.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: db-data
        labels: {{- include "db.selectorLabels" . | nindent 10 }}
      spec:
        {{- if .Values.global.storageClassName }}
        storageClassName: {{ .Values.global.storageClassName }}
        {{- end }}
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- else }}
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    {{- end }}
{{- end }}
