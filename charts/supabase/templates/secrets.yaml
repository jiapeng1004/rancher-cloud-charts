{{- if .Values.createSecrets -}}
## JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.fullname" . }}-jwt
  namespace: {{ .Release.Namespace }}
  labels: {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
data:
  anonKey: {{ .Values.secret.jwt.anonKey | b64enc | quote }}
  serviceKey: {{ .Values.secret.jwt.serviceKey | b64enc | quote }}
  secret: {{ .Values.secret.jwt.secret | b64enc | quote }}
---
## Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.secret.db.password | b64enc | quote }}
  database: {{ .Values.secret.db.database | b64enc | quote }}
---
