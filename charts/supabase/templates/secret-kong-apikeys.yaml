{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- if and .Values.enabled (eq .Values.gateway.mode "kong") (.Values.gateway.kong.useComposePrep | default true) }}
{{- $anon := trim (.Values.supabase.anonKey | default "") }}
{{- $srv := trim (.Values.supabase.serviceRoleKey | default "") }}
{{- $pub := trim (.Values.supabase.publishableKey | default "") }}
{{- $sec := trim (.Values.supabase.secretApiKey | default "") }}
{{- $asymAnon := trim (.Values.supabase.anonKeyAsymmetric | default "") }}
{{- $asymSrv := trim (.Values.supabase.serviceRoleKeyAsymmetric | default "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-kong-apikeys
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kong
type: Opaque
stringData:
  SUPABASE_ANON_KEY: {{ $anon | quote }}
  SUPABASE_SERVICE_KEY: {{ $srv | quote }}
  SUPABASE_PUBLISHABLE_KEY: {{ $pub | quote }}
  SUPABASE_SECRET_KEY: {{ $sec | quote }}
  ANON_KEY_ASYMMETRIC: {{ $asymAnon | quote }}
  SERVICE_ROLE_KEY_ASYMMETRIC: {{ $asymSrv | quote }}
  DASHBOARD_USERNAME: {{ .Values.gateway.kong.dashboard.username | quote }}
  DASHBOARD_PASSWORD: {{ .Values.gateway.kong.dashboard.password | quote }}
{{- end }}
