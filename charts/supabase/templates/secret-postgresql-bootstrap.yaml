{{- if and .Values.enabled .Values.bundled.postgres .Values.postgresql .Values.postgresql.supabase .Values.postgresql.supabase.composeMode }}
{{- /* 与 compose db 对齐：jwt.sql init 需要 JWT_SECRET / JWT_EXP 已注入 PostgreSQL Pod */}}
{{- $jwtIn := trim (.Values.jwt.secret | default "") }}
{{- if eq (len $jwtIn) 0 }}
{{- fail "jwt.secret 不能为空（initdb 中 jwt.sql 依赖 JWT_SECRET）。" }}
{{- end }}
{{- $jwt := $jwtIn }}
{{- if lt (len $jwt) 32 }}
{{- $saltJwt := printf "rancher-short-jwt-pad|v1|%s|%s|%s|%s|%s" $jwtIn .Release.Name .Release.Namespace .Chart.Version .Chart.Name }}
{{- $digestJwt := sha256sum $saltJwt }}
{{- $nJwt := sub 32 (len $jwt) | int }}
{{- $jwt = print $jwt (printf "%.*s" $nJwt $digestJwt) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-postgresql-bootstrap" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
  JWT_EXP: {{ .Values.jwt.expirySeconds | quote }}
{{- end }}
