{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $db := .Values.externalDatabase }}
{{- if eq $db.gotrueDbUrl "" }}
{{- fail "values.externalDatabase.gotrueDbUrl 不能为空（GoTrue DB：postgres://supabase_auth_admin:...@host/db）" }}
{{- end }}
{{- if eq $db.restDbUri "" }}
{{- fail "values.externalDatabase.restDbUri 不能为空（PostgREST：postgres://authenticator:...@host/db）" }}
{{- end }}
{{- if or (eq $db.realtime.host "") (eq $db.realtime.password "") }}
{{- fail "values.externalDatabase.realtime.host 与 realtime.password 不能为空" }}
{{- end }}
{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GOTRUE_DB_DATABASE_URL: {{ $db.gotrueDbUrl | quote }}
  PGRST_DB_URI: {{ $db.restDbUri | quote }}
  REALTIME_DB_PASSWORD: {{ $db.realtime.password | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  SECRET_KEY_BASE: {{ .Values.realtimeSecretKeyBase | quote }}
{{- end }}
