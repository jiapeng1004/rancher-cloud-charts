{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $bund := .Values.bundled.postgres }}
{{- $ext := .Values.externalDatabase }}
{{- $pgSvc := printf "%s-postgresql" .Release.Name }}
{{- if .Values.enabled }}
{{- if $bund }}
{{- $pwd := required "bundled.postgres=true 时请设置 postgresql.postgresql.password" .Values.postgresql.postgresql.password }}
{{- $usr := .Values.postgresql.postgresql.user }}
{{- $dbn := .Values.postgresql.postgresql.database }}
{{- $u := printf "postgres://%s:%s@%s:%s/%s" $usr $pwd $pgSvc "5432" $dbn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GOTRUE_DB_DATABASE_URL: {{ $u | quote }}
  PGRST_DB_URI: {{ $u | quote }}
  REALTIME_DB_PASSWORD: {{ $pwd | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  SECRET_KEY_BASE: {{ .Values.realtimeSecretKeyBase | quote }}
{{- else }}
{{- $e := $ext }}
{{- $r := ($e.realtime | default dict) }}
{{- $rh := trim (toString ($r.host | default "")) }}
{{- $extHost := ternary $rh (trim (toString ($e.host | default ""))) (ne $rh "") }}
{{- $rp := trim (toString ($r.port | default "")) }}
{{- $extPort := ternary $rp (trim (toString ($e.port | default "5432"))) (ne $rp "") }}
{{- $rdn := trim (toString ($r.dbName | default "")) }}
{{- $extDbName := ternary $rdn (trim (toString ($e.dbName | default "postgres"))) (ne $rdn "") }}
{{- $ru := trim (toString ($r.user | default "")) }}
{{- $extUser := ternary $ru (trim (toString ($e.user | default ""))) (ne $ru "") }}
{{- $rpwd := trim (toString ($r.password | default "")) }}
{{- $extPwd := ternary $rpwd (trim (toString ($e.password | default ""))) (ne $rpwd "") }}
{{- $assembled := trim (printf "postgres://%s:%s@%s:%s/%s" (urlquery $extUser) (urlquery $extPwd) $extHost $extPort $extDbName) }}
{{- $gtRaw := trim (toString ($ext.gotrueDbUrl | default "")) }}
{{- $rsRaw := trim (toString ($ext.restDbUri | default "")) }}
{{- $gotrue := default $assembled $gtRaw }}
{{- $rest := default $assembled $rsRaw }}
{{- $rest := default $gotrue $rest }}
{{- if or (eq $gotrue "") (eq $rest "") }}
{{- fail "bundled.postgres=false：请填写 externalDatabase.host / user / password / dbName（port 可选，默认 5432），模板会拼装 postgres:// 供 GoTrue/PostgREST；或至少提供 externalDatabase.gotrueDbUrl 与 REST 连接（可为同一 URL，见 README）。" }}
{{- end }}
{{- if and .Values.components.realtime (or (eq $extHost "") (eq $extPwd "")) }}
{{- fail "bundled.postgres=false 且启用 realtime：请填写外链库 externalDatabase.host 与密码；GoTrue 仅能通过 gotrueDbUrl 覆盖时 Realtime 仍需要 DB_HOST/密码。" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GOTRUE_DB_DATABASE_URL: {{ $gotrue | quote }}
  PGRST_DB_URI: {{ $rest | quote }}
  REALTIME_DB_PASSWORD: {{ $extPwd | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  SECRET_KEY_BASE: {{ .Values.realtimeSecretKeyBase | quote }}
{{- end }}
{{- end }}
