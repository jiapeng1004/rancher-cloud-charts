{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $bund := .Values.bundled.postgres }}
{{- $ext := .Values.externalDatabase }}
{{- $pgSvc := printf "%s-postgresql" .Release.Name }}
{{- if .Values.enabled }}
{{- /* PostgREST 要求 JWT_SECRET ≥32；Realtime 期望 SECRET_KEY_BASE ≥43。Rancher「生成」常过短：不足时在模板中用 sha256(release,input) 可重复后缀补齐。 */}}
{{- $jwtIn := trim (.Values.jwt.secret | default "") }}
{{- if eq (len $jwtIn) 0 }}
{{- fail "jwt.secret 不能为空（GoTrue / PostgREST / Realtime 共用 Secret JWT_SECRET）。" }}
{{- end }}
{{- $jwt := $jwtIn }}
{{- if lt (len $jwt) 32 }}
{{- $saltJwt := printf "rancher-short-jwt-pad|v1|%s|%s|%s|%s|%s" $jwtIn .Release.Name .Release.Namespace .Chart.Version .Chart.Name }}
{{- $digestJwt := sha256sum $saltJwt }}
{{- $nJwt := sub 32 (len $jwt) | int }}
{{- $jwt = print $jwt (printf "%.*s" $nJwt $digestJwt) }}
{{- end }}
{{- $skbIn := trim (.Values.realtimeSecretKeyBase | default "") }}
{{- if eq (len $skbIn) 0 }}
{{- fail "realtimeSecretKeyBase 不能为空（Realtime SECRET_KEY_BASE）。" }}
{{- end }}
{{- $skb := $skbIn }}
{{- if lt (len $skb) 43 }}
{{- $saltSk := printf "rancher-short-sk-pad|v1|%s|%s|%s|%s" $skbIn .Release.Name .Release.Namespace .Chart.Version }}
{{- $digestSk := sha256sum $saltSk }}
{{- $nSk := sub 43 (len $skb) | int }}
{{- $skb = print $skb (printf "%.*s" $nSk $digestSk) }}
{{- end }}
{{- $jwksIn := trim (.Values.jwt.jwks | default "") }}
{{- $pgrstJwt := $jwt }}
{{- if ne (len $jwksIn) 0 }}
{{- $pgrstJwt = $jwksIn }}
{{- end }}
{{- $anon := trim (.Values.supabase.anonKey | default "") }}
{{- if $bund }}
{{- $pwd := required "bundled.postgres=true 时请设置 postgresql.postgresql.password" .Values.postgresql.postgresql.password }}
{{- $dbn := .Values.postgresql.postgresql.database | default "postgres" }}
{{- $bud := .Values.bundledDb | default dict }}
{{- $useComposeRoles := $bud.composeDbRoles | default false }}
{{- $usrSingle := .Values.postgresql.postgresql.user | default "postgres" }}
{{- $gotrueU := ternary ($bud.gotrueDbUser | default "supabase_auth_admin") $usrSingle $useComposeRoles }}
{{- $restU := ternary ($bud.restDbUser | default "authenticator") $usrSingle $useComposeRoles }}
{{- $gotrueUrl := printf "postgres://%s:%s@%s:%s/%s" $gotrueU $pwd $pgSvc "5432" $dbn }}
{{- $restUrl := printf "postgres://%s:%s@%s:%s/%s" $restU $pwd $pgSvc "5432" $dbn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GOTRUE_DB_DATABASE_URL: {{ $gotrueUrl | quote }}
  PGRST_DB_URI: {{ $restUrl | quote }}
  REALTIME_DB_PASSWORD: {{ $pwd | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  PGRST_JWT_SECRET: {{ $pgrstJwt | quote }}
  SECRET_KEY_BASE: {{ $skb | quote }}
  ANON_KEY: {{ $anon | quote }}
{{- else }}
{{- $e := $ext }}
{{- $r := ($e.realtime | default dict) }}
{{- $rh := trim (toString ($r.host | default "")) }}
{{- $extHost := ternary $rh (trim (toString ($e.host | default ""))) (ne $rh "") }}
{{- $rp := trim (toString ($r.port | default "")) }}
{{- $extPort := ternary $rp (trim (toString ($e.port | default "5432"))) (ne $rp "") }}
{{- $rdn := trim (toString ($r.dbName | default "")) }}
{{- $extDbName := ternary $rdn (trim (toString ($e.dbName | default "postgres"))) (ne $rdn "") }}
{{- $ru := trim (toString ($r.user | default "")) }}
{{- $extUser := ternary $ru (trim (toString ($e.user | default ""))) (ne $ru "") }}
{{- $rpwd := trim (toString ($r.password | default "")) }}
{{- $extPwd := ternary $rpwd (trim (toString ($e.password | default ""))) (ne $rpwd "") }}
{{- $assembled := trim (printf "postgres://%s:%s@%s:%s/%s" (urlquery $extUser) (urlquery $extPwd) $extHost $extPort $extDbName) }}
{{- $gtRaw := trim (toString ($ext.gotrueDbUrl | default "")) }}
{{- $rsRaw := trim (toString ($ext.restDbUri | default "")) }}
{{- $gotrue := default $assembled $gtRaw }}
{{- $rest := default $assembled $rsRaw }}
{{- $rest := default $gotrue $rest }}
{{- if or (eq $gotrue "") (eq $rest "") }}
{{- fail "bundled.postgres=false：请填写 externalDatabase.host / user / password / dbName（port 可选，默认 5432），模板会拼装 postgres:// 供 GoTrue/PostgREST；或至少提供 externalDatabase.gotrueDbUrl 与 REST 连接（可为同一 URL，见 README）。" }}
{{- end }}
{{- if and .Values.components.realtime (or (eq $extHost "") (eq $extPwd "")) }}
{{- fail "bundled.postgres=false 且启用 realtime：请填写外链库 externalDatabase.host 与密码；GoTrue 仅能通过 gotrueDbUrl 覆盖时 Realtime 仍需要 DB_HOST/密码。" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-runtime
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  GOTRUE_DB_DATABASE_URL: {{ $gotrue | quote }}
  PGRST_DB_URI: {{ $rest | quote }}
  REALTIME_DB_PASSWORD: {{ $extPwd | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  PGRST_JWT_SECRET: {{ $pgrstJwt | quote }}
  SECRET_KEY_BASE: {{ $skb | quote }}
  ANON_KEY: {{ $anon | quote }}
{{- end }}
{{- end }}
