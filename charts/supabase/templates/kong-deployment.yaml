{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $g := .Values.gateway.kong }}
{{- $deck := printf "%s/%s" $g.declarativeMountPath $g.declarativeFilename }}
{{- if and .Values.enabled (eq .Values.gateway.mode "kong") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-kong
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ quote $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kong
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ quote $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kong
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kong
          image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: {{ $deck | quote }}
            - name: KONG_PLUGINS
              value: {{ $g.env.plugins | quote }}
            {{- with $g.env.dnsOrder }}
            - name: KONG_DNS_ORDER
              value: {{ . | quote }}
            {{- end }}
            {{- with $g.env.dnsNotFoundTtl }}
            - name: KONG_DNS_NOT_FOUND_TTL
              value: {{ . | quote }}
            {{- end }}
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000 reuseport backlog=16384"
            - name: KONG_ADMIN_LISTEN
              value: {{ $g.env.adminListen | quote }}
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
              value: "160k"
            - name: KONG_NGINX_PROXY_PROXY_BUFFERS
              value: "64 160k"
          volumeMounts:
            - name: deck
              mountPath: {{ $g.declarativeMountPath }}
              readOnly: true
          readinessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 30
          livenessProbe:
            exec:
              command:
                - kong
                - health
            initialDelaySeconds: 60
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: deck
          configMap:
            name: {{ $fullname }}-kong-deck
{{- end }}
