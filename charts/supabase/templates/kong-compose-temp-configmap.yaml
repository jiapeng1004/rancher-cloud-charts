{{- /* 对齐 docker/volumes/api/kong.yml：仅替换主机名段，形如 $SUPABASE_ANON_KEY 的占位仍由 kong-entrypoint.sh 替换 */}}
{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $auth := printf "http://%s-auth:9999" $fullname }}
{{- $rest := printf "http://%s-rest:3000" $fullname }}
{{- $rt := printf "http://%s-realtime:4000" $fullname }}
{{- $meta := printf "http://%s-meta:8080/" $fullname }}
{{- $storage := printf "http://%s-storage:5000/" $fullname }}
{{- $studio := printf "http://%s-studio:3000/" $fullname }}
{{- $fn := printf "http://%s-functions:9000/" $fullname }}
{{- if and .Values.enabled (eq .Values.gateway.mode "kong") (.Values.gateway.kong.useComposePrep | default true) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-kong-compose-temp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kong
data:
  temp.yml: |-
    _format_version: '2.1'
    _transform: true

    ###
    ### Consumers / Users
    ###
    consumers:
      - username: DASHBOARD
      - username: anon
        keyauth_credentials:
          - key: $SUPABASE_ANON_KEY
          - key: $SUPABASE_PUBLISHABLE_KEY
      - username: service_role
        keyauth_credentials:
          - key: $SUPABASE_SERVICE_KEY
          - key: $SUPABASE_SECRET_KEY

    ###
    ### Access Control List
    ###
    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin

    ###
    ### Dashboard credentials
    ###
    basicauth_credentials:
      - consumer: DASHBOARD
        username: '$DASHBOARD_USERNAME'
        password: '$DASHBOARD_PASSWORD'

    ###
    ### API Routes（与 compose 一致；Studio/Meta/Storage/Functions 等未在本 chart 部署时会在路由层 503，可在后续启用组件后自动联通）
    ###
    services:
      - name: auth-v1-open
        url: {{ $auth }}/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths:
              - /auth/v1/verify
        plugins:
          - name: cors

      - name: auth-v1-open-callback
        url: {{ $auth }}/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths:
              - /auth/v1/callback
        plugins:
          - name: cors

      - name: auth-v1-open-authorize
        url: {{ $auth }}/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths:
              - /auth/v1/authorize
        plugins:
          - name: cors

      - name: auth-v1-open-jwks
        url: {{ $auth }}/.well-known/jwks.json
        routes:
          - name: auth-v1-open-jwks
            strip_path: true
            paths:
              - /auth/v1/.well-known/jwks.json
        plugins:
          - name: cors

      - name: auth-v1-open-sso-acs
        url: "{{ $auth }}/sso/saml/acs"
        routes:
          - name: auth-v1-open-sso-acs
            strip_path: true
            paths:
              - /sso/saml/acs
        plugins:
          - name: cors

      - name: auth-v1-open-sso-metadata
        url: "{{ $auth }}/sso/saml/metadata"
        routes:
          - name: auth-v1-open-sso-metadata
            strip_path: true
            paths:
              - /sso/saml/metadata
        plugins:
          - name: cors

      - name: auth-v1
        url: {{ $auth }}/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths:
              - /auth/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: rest-v1
        url: {{ $rest }}/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths:
              - /rest/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: graphql-v1
        url: {{ $rest }}/rpc/graphql
        routes:
          - name: graphql-v1-all
            strip_path: true
            paths:
              - /graphql/v1
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Content-Profile: graphql_public"
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: realtime-v1-ws
        url: {{ $rt }}/socket
        protocol: ws
        routes:
          - name: realtime-v1-ws
            strip_path: true
            paths:
              - /realtime/v1/
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "x-api-key:$LUA_RT_WS_EXPR"
              replace:
                querystring:
                  - "apikey:$LUA_RT_WS_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: realtime-v1-rest
        url: {{ $rt }}/api
        protocol: http
        routes:
          - name: realtime-v1-rest
            strip_path: true
            paths:
              - /realtime/v1/api
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin
                - anon

      - name: storage-v1
        url: {{ $storage }}
        routes:
          - name: storage-v1-all
            strip_path: true
            paths:
              - /storage/v1/
        plugins:
          - name: cors
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: post-function
            config:
              access:
                - |
                  local auth = kong.request.get_header("authorization")
                  if auth == nil or auth == "" or auth:find("^%s*$") then
                    kong.service.request.clear_header("authorization")
                  end

      - name: functions-v1
        url: {{ $fn }}
        read_timeout: 150000
        routes:
          - name: functions-v1-all
            strip_path: true
            paths:
              - /functions/v1/
        plugins:
          - name: cors

      - name: well-known-oauth
        url: {{ $auth }}/.well-known/oauth-authorization-server
        routes:
          - name: well-known-oauth
            strip_path: true
            paths:
              - /.well-known/oauth-authorization-server
        plugins:
          - name: cors

      - name: meta
        url: {{ $meta }}
        routes:
          - name: meta-all
            strip_path: true
            paths:
              - /pg/
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - admin

      - name: dashboard
        url: {{ $studio }}
        routes:
          - name: dashboard-all
            strip_path: true
            paths:
              - /
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
{{- end }}
