{{- if .Values.deployment.kong.enabled -}}
{{- if .Values.ingress.enabled -}}
{{- $kh := (.Values.ingress.kongHostname | default "") | trim -}}
{{- if eq $kh "" -}}
{{- fail "[supabase] ingress.enabled 且启用 Kong 时须设置 ingress.kongHostname（对外 API 域名）" -}}
{{- end -}}
{{- $fullName := include "supabase.kong.fullname" . -}}
{{- $svcPort := .Values.service.kong.port -}}
{{- $path := .Values.ingress.kongPath | default "/" | trim -}}
{{- $pathType := .Values.ingress.kongPathType | default "Prefix" -}}
{{- $tlsSecret := (.Values.ingress.tlsSecretName | default "") | trim -}}
{{- $kv := default .Capabilities.KubeVersion.Version .Capabilities.KubeVersion.GitVersion }}
{{- $ingressV1 := semverCompare ">=1.19-0" $kv }}
{{- if $ingressV1 }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" $kv) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if ne $tlsSecret "" }}
  tls:
    - hosts:
        - {{ $kh | quote }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ $kh | quote }}
      http:
        paths:
          {{- if $ingressV1 }}
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- else }}
          - path: {{ $path }}
            backend:
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
          {{- end }}
{{- end }}
{{- end }}
