{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $pub := "" }}
{{- if eq .Values.gateway.mode "external" }}
{{- $pub = required "gateway.mode=external 时请设置 gateway.externalPublicUrl（外链 Kong 入口）" .Values.gateway.externalPublicUrl }}
{{- else }}
{{- $pub = required "请在 api.publicUrl（或兼容字段 api.externalUrl）填写对外网关根 URL（Ingress 前端）" (.Values.api.publicUrl | default .Values.api.externalUrl) }}
{{- end }}
{{- if and .Values.enabled .Values.components.auth }}
{{- $sb := .Values.supabase | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ quote $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: auth
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ quote $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gotrue
          image: "{{ .Values.images.auth.repository }}:{{ .Values.images.auth.tag }}"
          imagePullPolicy: {{ .Values.images.auth.pullPolicy }}
          ports:
            - name: http
              containerPort: 9999
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: API_EXTERNAL_URL
              value: {{ $pub | quote }}
            - name: GOTRUE_SITE_URL
              value: {{ default $pub ($sb.siteUrl | default "") | quote }}
            - name: GOTRUE_URI_ALLOW_LIST
              value: {{ default "" ($sb.additionalRedirectUrls | default "") | quote }}
            - name: GOTRUE_DISABLE_SIGNUP
              value: {{ default "false" ($sb.disableSignup | default "false") | quote }}
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: {{ default "true" ($sb.enableEmailSignup | default "true") | quote }}
            - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
              value: {{ default "false" ($sb.enableAnonymousUsers | default "false") | quote }}
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: {{ default "false" ($sb.enableEmailAutoconfirm | default "false") | quote }}
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: {{ default "admin@example.com" ($sb.smtpAdminEmail | default "") | quote }}
            - name: GOTRUE_SMTP_HOST
              value: {{ default "supabase-mail" ($sb.smtpHost | default "") | quote }}
            - name: GOTRUE_SMTP_PORT
              value: {{ default "2500" ($sb.smtpPort | default "2500") | quote }}
            - name: GOTRUE_SMTP_USER
              value: {{ default "fake_mail_user" ($sb.smtpUser | default "") | quote }}
            - name: GOTRUE_SMTP_PASS
              value: {{ default "fake_mail_password" ($sb.smtpPass | default "") | quote }}
            - name: GOTRUE_SMTP_SENDER_NAME
              value: {{ default "fake_sender" ($sb.smtpSenderName | default "") | quote }}
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              value: {{ ($sb.mailerUrlpathsInvite | default "/auth/v1/verify") | quote }}
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: {{ ($sb.mailerUrlpathsConfirmation | default "/auth/v1/verify") | quote }}
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              value: {{ ($sb.mailerUrlpathsRecovery | default "/auth/v1/verify") | quote }}
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              value: {{ ($sb.mailerUrlpathsEmailChange | default "/auth/v1/verify") | quote }}
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              value: {{ default "true" ($sb.enablePhoneSignup | default "true") | quote }}
            - name: GOTRUE_SMS_AUTOCONFIRM
              value: {{ default "true" ($sb.enablePhoneAutoconfirm | default "true") | quote }}
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: service_role
            - name: GOTRUE_JWT_AUD
              value: authenticated
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: authenticated
            - name: GOTRUE_JWT_EXP
              value: {{ .Values.jwt.expirySeconds | quote }}
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-runtime
                  key: JWT_SECRET
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-runtime
                  key: GOTRUE_DB_DATABASE_URL
            - name: GOTRUE_JWT_ISSUER
              value: {{ printf "%s/auth/v1" $pub | quote }}
{{- end }}
