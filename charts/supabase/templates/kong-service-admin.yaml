{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $g := .Values.gateway.kong }}
{{- if and .Values.enabled (eq .Values.gateway.mode "kong") $g.service.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kong-admin
  labels:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kong-admin
spec:
  type: {{ $g.service.admin.type }}
  ports:
    - port: {{ $g.service.admin.port }}
      targetPort: {{ $g.service.admin.targetPort }}
      protocol: TCP
      name: admin
  selector:
    app.kubernetes.io/name: {{ quote $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kong
{{- end }}
