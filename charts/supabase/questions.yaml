categories:
  - supabase
  - postgres
  - database

questions:
  # --- Ingress / Kong ---
  - variable: ingress.enabled
    type: boolean
    default: true
    label: 启用 Ingress（指向 Kong Gateway）
    description: Kong 网关对外的 HTTP Ingress；关闭时需自行暴露 Service。
    group: Ingress

  - variable: ingress.className
    type: string
    default: nginx
    label: IngressClass（Kong，K8s 1.18+）
    description: Kong 网关 Ingress 控制器类名（如 nginx、alb）。Studio 可选单独覆盖。
    group: Ingress

  - variable: ingress.studio.enabled
    type: boolean
    default: false
    label: 为 Studio 单独创建 Ingress
    description: |-
      Kong Ingress 只管 API；打开此项后为 Studio Deployment 增设独立 Ingress。需填写域名或通过 YAML 填写 ingress.studio.hosts；
      HTTPS 推荐使用 tlsAuto 或手写 ingress.studio.tls。
    group: Ingress
    required: false
    show_if: deployment.studio.enabled=true

  - variable: ingress.studio.hostNames
    type: string
    default: ""
    label: Studio 域名（逗号分隔，多域名共用同一路径）
    description: |-
      例：mms.example.com,activity.example.com — 与各域名对应的 HTTPS 域名一致（配合 tlsAuto 或手写 tls）。
      若使用「编辑 YAML」配置 ingress.studio.hosts（结构化），可留空本项。
    group: Ingress
    required: false
    show_if: ingress.studio.enabled=true

  - variable: ingress.studio.path
    type: string
    default: /
    label: Studio Ingress 路径
    description: hostNames 模式下各域名共用的路径（默认 `/`）。
    group: Ingress
    required: false
    show_if: ingress.studio.enabled=true

  - variable: ingress.studio.tlsAuto.enabled
    type: boolean
    default: false
    label: 为 Studio 启用 HTTPS（自动组装 tls.hosts）
    description: |-
      打开后须在下方填写 tlsAuto.secretName（集群中已存在的 TLS Secret 名称，如 ssl）。
      证书须覆盖上文 Studio 的全部域名。
    group: Ingress
    required: false
    show_if: ingress.studio.enabled=true

  - variable: ingress.studio.tlsAuto.secretName
    type: string
    default: ""
    label: Studio TLS Secret 名称（如 ssl）
    description: 对应 `kubectl create secret tls ssl ...`，并在证书 SAN 中包含所有 Studio 域名。
    group: Ingress
    required: false
    show_if: ingress.studio.tlsAuto.enabled=true

  - variable: ingress.studio.className
    type: string
    default: ""
    label: Studio IngressClass（可留空继承 Kong）
    description: 留空则使用 **ingress.className**（通常为 nginx）。
    group: Ingress
    required: false
    show_if: ingress.studio.enabled=true

  # --- 密钥与数据库 ---
  - variable: secret.jwt.secret
    type: password
    default: "your-super-secret-jwt-token-with-at-least-32-characters-long"
    label: JWT 密钥（≥32 字符）
    description: >-
      Supabase / PostgREST / Realtime 等共用；请务必在生产改为随机串（默认仅为满足长度演示）。
    min_length: 32
    required: true
    group: 密钥与安全

  - variable: deployment.db.enabled
    type: boolean
    default: true
    label: 部署内置 Postgres（StatefulSet）
    description: >-
      「关」时使用外链库，需填写主机与端口。**关**时必须确保库已就绪并完成扩展/迁移。
    group: Postgres

  - variable: secret.db.host
    type: string
    default: ""
    label: 外链 Postgres 主机名
    description: 仅在 **关闭内置库**（deployment.db.enabled=false）时必填；不写协议前缀。
    group: Postgres

  - variable: secret.db.port
    type: string
    default: "5432"
    label: 外链 Postgres 端口
    group: Postgres

  - variable: secret.db.password
    type: password
    default: "your-super-secret-and-long-postgres-password"
    label: Postgres 密码
    description: >-
      内置库或外链库的 postgres 口令；表单安装后请务必更换。
    required: true
    group: Postgres

  - variable: secret.db.database
    type: string
    default: postgres
    label: 数据库库名（默认 postgres）
    group: Postgres

  - variable: persistence.defaultStorageClassName
    type: string
    default: ""
    label: 全局 PVC StorageClass（所有需要持久卷的组件共用）
    description: >-
      留空不写 storageClassName，由集群默认 StorageClass 绑定；填写则 Postgres、Functions、MinIO、storage、snippets、deno、imgproxy 等本 Chart PVC 共用该类名。
    group: 持久卷（StorageClass）
    required: false

  - variable: secret.realtime.secretKeyBase
    type: password
    default: "UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq"
    label: Realtime SECRET_KEY_BASE（≥43 字符）
    description: >-
      Phoenix 等价机密；占位符时请改为 openssl rand -base64 64 等形式。**不少于 43 字符**可避免常见自检失败。
    min_length: 43
    required: true
    group: 密钥与安全

  # --- Auth 外部 URL ---
  - variable: environment.auth.API_EXTERNAL_URL
    type: string
    default: "http://supabase.local"
    label: Auth 外部 API 根 URL（必填）
    description: >-
      用户浏览器/客户端访问的网关根地址，形如 https://supabase.example.com（与 Ingress/反代入口一致）。
    required: true
    group: 对外 URL（Auth）

  - variable: environment.auth.GOTRUE_SITE_URL
    type: string
    default: "http://supabase.local"
    label: GOTRUE_SITE_URL（可留空与 API_EXTERNAL_URL 相同）
    description: >-
      留空时可在 Helm 中用其它逻辑回填；表单建议与 **API_EXTERNAL_URL** 同源。
    group: 对外 URL（Auth）

  # --- 组件开关 ---
  - variable: deployment.studio.enabled
    type: boolean
    default: true
    label: 部署 Studio 管理控制台
    group: 组件

  - variable: deployment.minio.enabled
    type: boolean
    default: false
    label: 部署内置 MinIO（对象存储）
    description: >-
      Compose 常与 Storage 联用；无对象存储时请改 **true** 或接云厂商 S3 并在 YAML 配置。
    group: 组件

  - variable: deployment.analytics.enabled
    type: boolean
    default: true
    label: 部署 Logflare / Analytics（分析）
    group: 组件

  - variable: deployment.vector.enabled
    type: boolean
    default: true
    label: 部署 Vector（日志管线）
    group: 组件

  # --- 镜像（常用） ---
  - variable: image.db.repository
    type: string
    default: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/postgres"
    label: 数据库镜像仓库（supabase/postgres）
    group: 镜像（默认国内前缀）

  - variable: image.db.tag
    type: string
    default: "15.8.1.085"
    label: 数据库镜像标签
    group: 镜像（默认国内前缀）

  - variable: image.kong.repository
    type: string
    default: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kong/kong"
    label: Kong 镜像仓库
    group: 镜像（默认国内前缀）

  - variable: image.kong.tag
    type: string
    default: "3.9.1"
    label: Kong 镜像标签
    group: 镜像（默认国内前缀）

  - variable: image.minio.repository
    type: string
    default: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio"
    label: MinIO 服务端镜像仓库（Docker Hub minio/minio）
    description: >-
      MinIO/MC 为国内拉取已从 Chainguard 改为 **`minio/minio`、`minio/mc`**。
    group: 镜像（默认国内前缀）

  - variable: image.minio.tag
    type: string
    default: "RELEASE.2024-01-10T00-54-08Z"
    label: MinIO 镜像标签
    group: 镜像（默认国内前缀）
