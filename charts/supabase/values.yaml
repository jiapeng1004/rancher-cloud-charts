## 选型原则（本仓库对相关 chart 的约定）
## - **优先、完整支持外链**：Postgres→RDS/PolarDB/自建 PG；网关→云上 Kong/Nginx/SLB/全局 Ingress Controller。生产与中长期维护建议沿用现网中间件。
## - **同时支持可选内建**：`bundled` / `gateway.mode=kong|nginx` 仅作 PoC、离线或无人群托管控环境；内建 Postgres 仍为社区镜像，≠ Supabase 官方发行库。
##
## gateway.mode：nginx | kong | external（外链入口时设为 external）

enabled: true
nameOverride: ""
fullnameOverride: ""

bundled:
  postgres: false

postgresql:
  ingress:
    enabled: false

jwt:
  expirySeconds: "3600"
  secret: "CHANGE-me-min-32-chars-supabase-jwt-secret"

realtimeSecretKeyBase: >-
  REPLACE_REALTIME_SECRET_KEY_BASE_64PLUS_CHARS_HEX_OR_RANDOM_STRING

api:
  publicUrl: "http://CHANGE.ME.example.com"
  externalUrl: ""

gateway:
  mode: nginx   # nginx | kong | external
  listenPort: 8080
  externalPublicUrl: ""

  kong:
    image:
      repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kong/kong
      tag: "3.9.1"
      pullPolicy: IfNotPresent
    env:
      plugins: "bundled"
      adminListen: "0.0.0.0:8001 reuseport backlog=16384"
    service:
      proxy:
        type: ClusterIP
        port: 80
        targetPort: 8000
      admin:
        enabled: true
        type: ClusterIP
        port: 8001
        targetPort: 8001
    declarativeMountPath: /kong-declarative
    declarativeFilename: kong.yml

images:
  nginx:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  auth:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/gotrue
    tag: "v2.186.0"
    pullPolicy: IfNotPresent
  rest:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgrest/postgrest
    tag: "v14.8"
    pullPolicy: IfNotPresent
  realtime:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/realtime
    tag: "v2.76.5"
    pullPolicy: IfNotPresent

externalDatabase:
  gotrueDbUrl: ""
  restDbUri: ""
  realtime:
    host: ""
    port: "5432"
    dbName: "postgres"
    user: "supabase_admin"
    password: ""
    encryptionKeyDefault: supabaserealtime

components:
  auth: true
  rest: true
  realtime: true

service:
  nginx:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: supabase.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
imagePullSecrets: []
podAnnotations: {}
