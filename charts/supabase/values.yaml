# 组件环境变量：`templates/<组件>/deployment*.yaml` 对 `environment.<组件>` 做 `range`（整表逐项注入）。
# Storage 等对个别键有直接引用后再 `range`。若某小节从本文件删掉，模板需能接受空 map（或为 `default dict`）。
environment:
  analytics:
    LOGFLARE_NODE_HOST: 127.0.0.1
    DB_USERNAME: supabase_admin
    DB_DATABASE: _supabase
    DB_DRIVER: postgresql
    DB_SCHEMA: _analytics
    POSTGRES_BACKEND_SCHEMA: _analytics
    LOGFLARE_SINGLE_TENANT: "true"
    LOGFLARE_SUPABASE_MODE: "true"
    LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true

  auth:
    # GoTrue 环境变量由 templates/auth/_environment.tpl 显式列出；不要在 auth 根下乱放键（应放在 extra）。
    DB_USER: supabase_auth_admin
    DB_DRIVER: postgres
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    DB_SSL: disable
    # 与 Kong Ingress 对外域名保持一致（协议 + host，按需改 https）。
    API_EXTERNAL_URL: http://supabase.local
    GOTRUE_API_HOST: "0.0.0.0"
    GOTRUE_API_PORT: "9999"
    # 常为 Studio/前端入口；应与实际对外域名一致。
    GOTRUE_SITE_URL: http://supabase.local
    GOTRUE_URI_ALLOW_LIST: "*"
    GOTRUE_DISABLE_SIGNUP: "false"
    GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    GOTRUE_JWT_ADMIN_ROLES: service_role
    GOTRUE_JWT_AUD: authenticated
    GOTRUE_JWT_EXP: "3600"
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    GOTRUE_MAILER_AUTOCONFIRM: "true"
    GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
    # GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true
    # GOTRUE_SMTP_MAX_FREQUENCY: 1s
    GOTRUE_SMTP_ADMIN_EMAIL: "SMTP_ADMIN_MAIL"
    GOTRUE_SMTP_HOST: "SMTP_HOST"
    GOTRUE_SMTP_PORT: "123"
    GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    GOTRUE_SMS_AUTOCONFIRM: "false"
    GOTRUE_SMTP_SENDER_NAME: "SMTP_SENDER_NAME"
    GOTRUE_MAILER_URLPATHS_INVITE: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
    GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
    ## Hooks 等扩展键写在 extra（见 upstream auth-hooks）；空 map 不产生 env。
    extra: { }

  db:
    POSTGRES_HOST: /var/run/postgresql
    PGPORT: "5432"
    POSTGRES_PORT: "5432"
    JWT_EXP: 3600
    # POSTGRES_HOST_AUTH_METHOD: md5
    ## Enable SSL for postgres by specifying paths for mounted certificate key pair
    # POSTGRES_SSL_CERT: /path/to/ssl/server.crt
    # POSTGRES_SSL_KEY: /path/to/ssl/server.key

  functions:
    DB_USERNAME: postgres
    DB_DRIVER: postgresql
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    DB_SSL: disable
    VERIFY_JWT: false

  imgproxy:
    IMGPROXY_BIND: ":5001"
    IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
    IMGPROXY_USE_ETAG: "true"
    IMGPROXY_ENABLE_WEBP_DETECTION: "true"

  kong:
    KONG_DATABASE: "off"
    KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
    ## https://github.com/supabase/cli/issues/14
    KONG_DNS_ORDER: LAST,A,CNAME
    KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,post-function
    KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
    KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    KONG_LOG_LEVEL: warn

    # Please see: https://github.com/supabase-community/supabase-kubernetes/issues/187
    KONG_NGINX_WORKER_PROCESSES: "2"

  meta:
    DB_USER: supabase_admin
    DB_DRIVER: postgres
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    DB_SSL: disable
    PG_META_PORT: "8080"

  realtime:
    DB_USER: supabase_admin
    ## Set to true to enforce TLS connections to Postgres
    DB_SSL: false
    PORT: "4000"
    FLY_ALLOC_ID: fly123
    FLY_APP_NAME: realtime
    ENABLE_TAILSCALE: "false"
    DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
    DB_ENC_KEY: supabaserealtime
    ERL_AFLAGS: -proto_dist inet_tcp
    DNS_NODES: "''"
    RLIMIT_NOFILE: "10000"
    APP_NAME: realtime
    SEED_SELF_HOST: true
    RUN_JANITOR: true

  rest:
    DB_USER: authenticator
    DB_DRIVER: postgres
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    DB_SSL: disable
    PGRST_DB_SCHEMAS: public,storage,graphql_public
    PGRST_DB_ANON_ROLE: anon
    PGRST_DB_USE_LEGACY_GUCS: false
    PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    DB_USER: supabase_storage_admin
    DB_DRIVER: postgres
    ## SSL mode options: disable, allow, prefer, require, verify-ca, verify-full
    DB_SSL: disable
    REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    FILE_SIZE_LIMIT: "52428800"
    FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    TENANT_ID: stub
    REGION: stub
    GLOBAL_S3_BUCKET: stub
    ENABLE_IMAGE_TRANSFORMATION: "true"

  studio:
    HOSTNAME: "::"
    STUDIO_PORT: "3000"
    POSTGRES_PORT: 5432
    DEFAULT_ORGANIZATION_NAME: Default Organization
    DEFAULT_PROJECT_NAME: Default Project
    # Studio 对外根 URL（与 Ingress / 浏览器地址栏一致）。
