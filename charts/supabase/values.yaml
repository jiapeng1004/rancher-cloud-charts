## 默认与官方 docker/docker-compose.yml 对齐：内嵌 Postgres + Kong，可选关闭后改外链。
## 参考：本地仓库 docker-compose 中 services.db（supabase/postgres）、kong、auth、rest、realtime。
##
## gateway.mode：kong（与 compose 一致）| nginx | external

enabled: true
nameOverride: ""
fullnameOverride: ""

bundled:
  # 与 compose 一致：默认内嵌 PostgreSQL 子 chart（非外链 RDS）
  postgres: true

# 内嵌库且使用 supabase/postgres 镜像初始化角色后，连接串用户与 compose 一致；
# 若仍用 library/postgres 单用户，请设 composeDbRoles: false。
bundledDb:
  composeDbRoles: true
  gotrueDbUser: supabase_auth_admin
  restDbUser: authenticator
  realtimeDbUser: supabase_admin

postgresql:
  # 子 chart 合并键：与官方 compose 的 db 服务镜像一致（可自行换 tag）
  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/postgres
    tag: "15.8.1.085"
    pullPolicy: IfNotPresent
  # 内嵌 PG Deployment：Pod/容器 securityContext（子 chart deployment 模板已接线）
  # UID/GID：runAsUser=105、runAsGroup=106、fsGroup=106；seccomp 见下（<1.22 模板自动去掉 seccompProfile）
  podSecurityContext:
    fsGroup: 106
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 105
    runAsGroup: 106
  ingress:
    enabled: false
  postgresql:
    user: postgres
    # 与 compose .env 中 POSTGRES_PASSWORD 同类：请安装后替换
    password: your-super-secret-and-long-postgres-password
    database: postgres
    postgresPassword: ""
    # 默认留空不写 PGDATA，与 upstream compose/db 挂载 /var/lib/postgresql/data 行为一致。
    pgdata: ""
  supabase:
    # 对齐 docker-compose services.db（command / init SQL / JWT 注入）；换非 supabase/postgres 镜像时请 false
    composeMode: true
    postgresqlCustomPersistence: false
  persistence:
    enabled: true
    size: 10Gi

jwt:
  expirySeconds: "3600"
  # PostgREST 要求至少 32 字符；不要使用更短的占位串或留空
  secret: "your-super-secret-jwt-token-with-at-least-32-characters-long"
  # 对齐 compose 的 JWT_JWKS（留空则用 JWT_SECRET）；Podman/JWKS 场景再填 JSON
  jwks: ""

realtimeSecretKeyBase: >-
  UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq

# 对齐 docker/.env.example：Kong / Realtime health / 可选 opaque keys
supabase:
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"
  serviceRoleKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q"
  publishableKey: ""
  secretApiKey: ""
  anonKeyAsymmetric: ""
  serviceRoleKeyAsymmetric: ""
  siteUrl: "http://localhost:3000"
  additionalRedirectUrls: ""
  disableSignup: "false"
  enableEmailSignup: "true"
  enableEmailAutoconfirm: "false"
  enableAnonymousUsers: "false"
  enablePhoneSignup: "true"
  enablePhoneAutoconfirm: "true"
  smtpAdminEmail: "admin@example.com"
  smtpHost: "supabase-mail"
  smtpPort: "2500"
  smtpUser: "fake_mail_user"
  smtpPass: "fake_mail_password"
  smtpSenderName: "fake_sender"
  mailerUrlpathsInvite: "/auth/v1/verify"
  mailerUrlpathsConfirmation: "/auth/v1/verify"
  mailerUrlpathsRecovery: "/auth/v1/verify"
  mailerUrlpathsEmailChange: "/auth/v1/verify"
  restDbSchemas: "public,storage,graphql_public"
  restDbMaxRows: "1000"
  restDbExtraSearchPath: "public"
api:
  publicUrl: "http://127.0.0.1:8000"
  externalUrl: ""

gateway:
  # 与 compose 的 kong 服务一致（8000 代理）
  mode: kong
  listenPort: 8080
  externalPublicUrl: ""

  kong:
    useComposePrep: true
    dashboard:
      username: supabase
      password: this_password_is_insecure_and_should_be_updated
    image:
      repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kong/kong
      tag: "3.9.1"
      pullPolicy: IfNotPresent
    env:
      plugins: "request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function"
      adminListen: "0.0.0.0:8001 reuseport backlog=16384"
      dnsOrder: "LAST,A,CNAME"
      dnsNotFoundTtl: "1"
    service:
      proxy:
        type: ClusterIP
        port: 80
        targetPort: 8000
      admin:
        enabled: true
        type: ClusterIP
        port: 8001
        targetPort: 8001
    declarativeMountPath: /kong-declarative
    declarativeFilename: kong.yml

images:
  nginx:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  auth:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/gotrue
    tag: "v2.186.0"
    pullPolicy: IfNotPresent
  rest:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgrest/postgrest
    tag: "v14.8"
    pullPolicy: IfNotPresent
  realtime:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/supabase/realtime
    tag: "v2.76.5"
    pullPolicy: IfNotPresent

# bundled.postgres=false 时使用（外链 RDS 等）
externalDatabase:
  host: ""
  port: "5432"
  dbName: "postgres"
  user: ""
  password: ""
  gotrueDbUrl: ""
  restDbUri: ""
  realtime:
    host: ""
    port: ""
    dbName: ""
    user: ""
    password: ""
    encryptionKeyDefault: supabaserealtime

components:
  auth: true
  rest: true
  realtime: true

service:
  nginx:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: supabase.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
imagePullSecrets: []
podAnnotations: {}
