apiVersion: v2
name: middleware-bundle
icon: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.17.0/icons/helm/helm-original.svg
description: |
  Umbrella chart：一键拉起常用中间件（各组件仍有独立 Helm，可单独安装）。
  在 charts/middleware-bundle 目录执行: helm dependency update
version: 0.1.0
appVersion: "1.0"
type: application
keywords:
  - mysql
  - redis
  - postgresql
  - minio
  - umbrella
maintainers:
  - name: rancher-cloud-charts

dependencies:
  - name: mysql
    version: "8.0.0"
    repository: file://../mysql-new/8.0
    condition: mysql.enabled
  - name: redis
    version: "7.2.0"
    repository: file://../redis-new/7.2
    condition: redis.enabled
  - name: postgresql
    version: "16.0.0"
    repository: file://../postgresql-new/16
    condition: postgresql.enabled
  - name: minio
    version: "2024.01.10"
    repository: file://../minio-new/2024-01
    condition: minio.enabled
