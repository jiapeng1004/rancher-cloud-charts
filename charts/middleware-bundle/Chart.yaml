apiVersion: v2
name: middleware-bundle
icon: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.17.0/icons/helm/helm-original.svg
description: |
  Umbrella chart：一键拉起常用中间件（各组件仍有独立 Helm，可单独安装）。
  子 chart 已嵌入 charts/（Rancher / helm-git 可直接 template）；更新单体后请按需同步并重打版本。
version: 0.1.1
appVersion: "1.0"
type: application
keywords:
  - mysql
  - redis
  - postgresql
  - minio
  - umbrella
maintainers:
  - name: rancher-cloud-charts

dependencies:
  - name: mysql
    version: "8.0.0"
    repository: file://charts/mysql
    condition: mysql.enabled
  - name: redis
    version: "7.2.0"
    repository: file://charts/redis
    condition: redis.enabled
  - name: postgresql
    version: "16.0.0"
    repository: file://charts/postgresql
    condition: postgresql.enabled
  - name: minio
    version: "2024.01.10"
    repository: file://charts/minio
    condition: minio.enabled
