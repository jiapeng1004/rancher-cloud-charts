# Kong Gateway（声明式 / 无数据库）
# 镜像前缀以华为云 SWR 为准，可按控制台说明调整。

nameOverride: ""
fullnameOverride: ""

enabled: true

image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/kong/kong
  tag: "3.9.1"
  pullPolicy: IfNotPresent

# Kong 环境变量（常用项）
env:
  plugins: "bundled"
  adminListen: "0.0.0.0:8001 reuseport backlog=16384"

service:
  proxy:
    type: ClusterIP
    port: 80
    targetPort: 8000
  admin:
    enabled: true
    type: ClusterIP
    port: 8001
    targetPort: 8001

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: kong.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
imagePullSecrets: []

declarative:
  enabled: true
  mountPath: /kong-declarative
  filename: kong.yml
  config: |
    _format_version: "3.0"
    _transform: false
    services: []
