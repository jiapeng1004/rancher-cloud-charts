## 自动生成 / 或由 sync_rancher_questions.py 维护；与 values.yaml 常见字段对齐。高级项请直接在 Rancher 「编辑 YAML」中补充。
categories:
- janus webrtc
questions:
- variable: replicaCount
  type: int
  label: 副本数
  description: Deployment 副本数量
  group: 通用
  default: 1
  required: true
- variable: image.repository
  type: string
  label: 镜像仓库
  description: 容器镜像仓库地址
  group: 镜像
  default: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/instrumentisto/janus-gateway
  required: true
- variable: image.tag
  type: string
  label: 镜像标签
  description: 镜像 tag
  group: 镜像
  default: latest
  required: true
- variable: image.pullPolicy
  type: enum
  label: 镜像拉取策略
  description: Kubernetes imagePullPolicy
  group: 镜像
  default: IfNotPresent
  required: true
  options:
  - IfNotPresent
  - Always
  - Never
- variable: service.type
  type: enum
  label: Service 类型
  description: Kubernetes Service.type
  group: 服务
  default: ClusterIP
  required: true
  options:
  - ClusterIP
  - NodePort
  - LoadBalancer
- variable: ingress.enabled
  type: boolean
  label: 启用 Ingress
  description: 若为 true，将渲染 Ingress（具体 hosts/tls 可在 YAML 中编辑）
  group: Ingress
  default: false
  required: false
- variable: ingress.className
  type: string
  label: IngressClass 名称
  description: Ingress 使用的 ingressClassName
  group: Ingress
  default: nginx
  required: false
  show_if: ingress.enabled=true
