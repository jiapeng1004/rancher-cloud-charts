apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowy-nacos-app
  labels:
    app: snowy-nacos-app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snowy-nacos-app
  template:
    metadata:
      name: snowy-nacos-app
      labels:
        app: snowy-nacos-app
    spec:
      containers:
        - name: snowy-nacos-app
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v2.4.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
              protocol: TCP
            - containerPort: 9848
              protocol: TCP
            - containerPort: 9849
              protocol: TCP
          env:
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            - name: MYSQL_SERVICE_HOST
              value: "{{.Values.global.server.mysql.host}}"
            - name: MYSQL_SERVICE_PORT
              value: "{{.Values.global.server.mysql.port}}"
            - name: MYSQL_SERVICE_DB_NAME
              value: "nacos"
            - name: MYSQL_SERVICE_USER
              value: "{{.Values.global.server.mysql.user}}"
            - name: MYSQL_SERVICE_PASSWORD
              value: "{{.Values.global.server.mysql.password}}"
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      restartPolicy: Always