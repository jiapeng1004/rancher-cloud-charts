image:
  repository: milvusdb/milvus
  tag: v2.2.12
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 19530
  webPort: 9091
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 31953

# Milvus configuration
milvus:
  mode: "standalone"
  etcdEndpoints: "etcd:2379"
  minioAddress: "minio:9000"
  minioAccessKey: "minioadmin"
  minioSecretKey: "minioadmin"
  minioBucketName: "milvus"
  logLevel: "info"

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 50Gi
  # hostPath: /var/lib/milvus

# Resources configuration
resources:
  requests:
    memory: "4Gi"
    cpu: "2"
  limits:
    memory: "8Gi"
    cpu: "4"

# Node selector configuration
nodeSelector:
  # Match nodes with disk type label (example)
  # disktype: ssd
  # Match nodes with enough memory
  # node.kubernetes.io/memory: "4Gi"

# Affinity configuration
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - ""
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: milvus
              app.kubernetes.io/instance: milvus
          topologyKey: "kubernetes.io/hostname"

# Tolerations configuration
tolerations:
  # Tolerate master node taint (uncomment if needed)
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule

# Pod security context configuration
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context configuration
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# Kubernetes compatibility settings
compatibility:
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: milvus.example.com
      paths:
        - path: /
          pathType: Prefix
