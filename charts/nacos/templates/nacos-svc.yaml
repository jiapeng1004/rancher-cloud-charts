apiVersion: v1
kind: Service
metadata:
  name: {{.Chart.Name}}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{.Chart.Name}}
  ports:
    - protocol: TCP
      port: 30848
      targetPort: 8848
      name: {{.Chart.Name}}-8848
    - protocol: TCP
      port: 30948
      targetPort: 9848
      name: {{.Chart.Name}}-9848
  type: NodePort
  