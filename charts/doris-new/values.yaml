# Doris chart values

# Enable/disable the chart
enabled: true

# Image settings
image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/doris
  be_tag: be-4.1.0
  fe_tag: fe-4.1.0
  pullPolicy: IfNotPresent

# FE settings（勿重复顶层 fe:/be:，后者会覆盖前者导致 service.port 为空）
fe:
  service:
    type: ClusterIP
    port: 8030
    httpPort: 8031
    queryPort: 9030
  replicas: 1
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  nodeSelector:
    # Match nodes with disk type label (example)
    # disktype: ssd
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - ""
  tolerations:
    # Tolerate master node taint (uncomment if needed)
    # - key: node-role.kubernetes.io/master
    #   operator: Exists
    #   effect: NoSchedule
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
#  securityContext:
#    runAsUser: 1000
#    runAsGroup: 1000

# BE settings（同上，service 与 replicas 等同一大键）
be:
  service:
    type: ClusterIP
    port: 9060
    webServerPort: 8040
    heartbeatPort: 9050
  replicas: 1
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  nodeSelector:
    # Match nodes with disk type label (example)
    # disktype: ssd
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - ""
  tolerations:
    # Tolerate master node taint (uncomment if needed)
    # - key: node-role.kubernetes.io/master
    #   operator: Exists
    #   effect: NoSchedule
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

# Privileged DaemonSet：在节点上设置 vm.max_map_count（常见于 Doris/大量 mmap）。
# hostPath=/ 挂载到 /host 后使用 chroot 执行宿主机 sysctl；需集群允许 privileged 与该类 hostPath。
# 默认关闭；若需与用户示例完全一致可设 hostPID/hostNetwork 为 true。
sysctlDaemonset:
  enabled: false
  # 非空时使用该命名空间安装 DaemonSet（例如 kube-system）；空则使用 Release.Namespace
  namespace: ""
  vmMaxMapCount: 2000000
  hostPID: false
  hostNetwork: false
  image:
    repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Kubernetes compatibility settings
compatibility:
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: doris.example.com
      paths:
        - path: /
          pathType: Prefix
