apiVersion: v1
kind: Service
metadata:
  name: {{ include "doris.fe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doris.fe.selectorLabels" . | nindent 4 }}
  {{- with .Values.fe.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.fe.service.type }}
  ports:
    - port: {{ .Values.fe.service.port }}
      targetPort: rpc
      protocol: TCP
      name: rpc
    - port: {{ .Values.fe.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.fe.service.queryPort }}
      targetPort: query
      protocol: TCP
      name: query
  selector:
    {{- include "doris.fe.selectorLabels" . | nindent 4 }}
