apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "doris.be.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doris.be.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "doris.be.fullname" . }}
  replicas: {{ .Values.be.replicas }}
  selector:
    matchLabels:
      {{- include "doris.be.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.be.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "doris.be.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.be.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "doris.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.be.podSecurityContext | nindent 8 }}
      containers:
        - name: be
          securityContext:
            {{- toYaml .Values.be.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - /opt/apache-doris/be/bin/start_be.sh --daemon && tail -f /opt/apache-doris/be/log/be.log
          ports:
            - name: rpc
              containerPort: 9060
              protocol: TCP
            - name: web
              containerPort: 8040
              protocol: TCP
            - name: heartbeat
              containerPort: 9050
              protocol: TCP
          env:
            - name: BE_HOME
              value: /opt/apache-doris/be
            - name: FE_HOST
              value: {{ include "doris.fe.fullname" . }}
          volumeMounts:
            - name: be-data
              mountPath: /opt/apache-doris/be/storage
          resources:
            {{- toYaml .Values.be.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: be-data
      spec:
        accessModes:
          - {{ .Values.be.persistence.accessMode | default "ReadWriteOnce" }}
        {{- if .Values.be.persistence.storageClass }}
        {{- if (eq "-" .Values.be.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.be.persistence.storageClass }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.be.persistence.size | default "10Gi" }}
