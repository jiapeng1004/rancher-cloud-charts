image:
  repository: php
  tag: 8.2-apache
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 80
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30080

# Database configuration
database:
  host: "mysql"
  port: 3306
  name: "shopxo"
  username: "shopxo"
  password: "shopxo123"

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  # hostPath: /var/www/html

# Resources configuration
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Node selector configuration
nodeSelector:
  # Match nodes with disk type label (example)
  # disktype: ssd

# Affinity configuration
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - ""
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shopxo
              app.kubernetes.io/instance: shopxo
          topologyKey: "kubernetes.io/hostname"

# Tolerations configuration
tolerations:
  # Tolerate master node taint (uncomment if needed)
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule

# Pod security context configuration
podSecurityContext:
  runAsUser: 33
  runAsGroup: 33
  fsGroup: 33

# Container security context configuration
securityContext:
  runAsUser: 33
  runAsGroup: 33

# Kubernetes compatibility settings
compatibility:
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: shop.example.com
      paths:
        - path: /
          pathType: Prefix
