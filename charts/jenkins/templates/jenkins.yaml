apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{.Release.Name}}
  name: {{.Release.Name}}
  namespace: {{.Release.Namespace}}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{.Release.Name}}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{.Release.Name}}
      namespace: server
    spec:
      affinity: {}
      containers:
        - image: >-
            registry.cn-hangzhou.aliyuncs.com/jp-java/jenkins:1.0.0
          imagePullPolicy: IfNotPresent
          name: jenkins
          ports:
            - containerPort: 8080
              name: web-8080
              protocol: TCP
            - containerPort: 50000
              name: node-50000
              protocol: TCP
          resources: {}
          env:
            - name: JENKINS_ADMIN_ID
              value: "{{.Values.user}}"
            - name: JENKINS_ADMIN_PASSWORD
              value: "{{.Values.password}}"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /var/jenkins_home
              name: jenkins-data
            - mountPath: /root/.m2
              name: maven-data
            - mountPath: /var/run/docker.sock
              name: docker-sock
              readOnly: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: jenkins-data
          hostPath:
            path: /var/jenkins_home
            type: DirectoryOrCreate
        - name: maven-data
          hostPath:
            path: /root/.m2
            type: DirectoryOrCreate
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30