{{- if and .Values.enabled .Values.sysctlDaemonset.enabled }}
{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $dsFullname := printf "%s-sysctl-configurer" $fullname | trunc 63 | trimSuffix "-" }}
{{- $ds := .Values.sysctlDaemonset }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $dsFullname }}
  namespace: {{ default .Release.Namespace $ds.namespace }}
  labels:
{{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "sysctl-configurer" | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
{{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "sysctl-configurer" | toYaml | nindent 6 }}
  template:
    metadata:
      labels:
{{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "sysctl-configurer" | toYaml | nindent 8 }}
    spec:
      {{- if $ds.hostPID }}
      hostPID: true
      {{- end }}
      {{- if $ds.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with $ds.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ds.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if $ds.tolerations }}
        {{- toYaml $ds.tolerations | nindent 8 }}
        {{- else }}
        - operator: Exists
        {{- end }}
      containers:
        - name: configurer
          image: "{{ $ds.image.repository }}:{{ $ds.image.tag }}"
          imagePullPolicy: {{ $ds.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              CH=/host
              VAL="$(printf '%s' '{{ $ds.vmMaxMapCount }}')"
              TEST="$CH/proc/sys/vm/max_map_count"
              if ! [ -e "$TEST" ]; then
                echo "missing ${TEST}; host root not mounted?" >&2
                exit 1
              fi
              applied=0
              for sysctl in /sbin/sysctl /usr/sbin/sysctl; do
                if [ -x "$CH$sysctl" ]; then
                  chroot "$CH" "$sysctl" -w vm.max_map_count="$VAL" && applied=1 && break
                fi
              done
              if [ "$applied" != 1 ]; then
                echo "$VAL" > "$TEST"
              fi
              CONF="$CH/etc/sysctl.conf"
              if [ -f "$CONF" ] && [ -w "$CONF" ]; then
                line="vm.max_map_count=${VAL}"
                if ! grep -qxF "$line" "$CONF" 2>/dev/null; then
                  printf '%s\n' "$line" >> "$CONF"
                fi
              fi
              printf 'Configured vm.max_map_count=%s on node\n' "$VAL"
              exec sleep infinity
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: false
          resources:
            {{- toYaml $ds.resources | nindent 12 }}
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
{{- end }}
