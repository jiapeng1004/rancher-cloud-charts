{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $chartLabel := printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- $feFullname := printf "%s-fe" $fullname | trunc 63 | trimSuffix "-" }}
{{- $beFullname := printf "%s-be" $fullname | trunc 63 | trimSuffix "-" }}
{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $feFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "fe" | toYaml | nindent 4 }}
spec:
  replicas: {{ .Values.fe.replicas }}
  selector:
    matchLabels:
      {{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "fe" | toYaml | nindent 6 }}
  template:
    metadata:
      {{- with .Values.fe.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "fe" | toYaml | nindent 8 }}
    spec:
      {{- with .Values.fe.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: default
      {{- with .Values.fe.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fe.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.fe.podSecurityContext | nindent 8 }}
      containers:
        - name: fe
          securityContext:
            {{- toYaml .Values.fe.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - /opt/apache-doris/fe/bin/start_fe.sh --daemon && tail -f /opt/apache-doris/fe/log/fe.log
          ports:
            - name: rpc
              containerPort: 8030
              protocol: TCP
            - name: http
              containerPort: 8031
              protocol: TCP
            - name: query
              containerPort: 9030
              protocol: TCP
          env:
            - name: FE_HOME
              value: /opt/apache-doris/fe
          volumeMounts:
            - name: fe-data
              mountPath: /opt/apache-doris/fe/doris-meta
          resources:
            {{- toYaml .Values.fe.resources | nindent 12 }}
      volumes:
        - name: fe-data
          {{- if .Values.fe.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $feFullname }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
