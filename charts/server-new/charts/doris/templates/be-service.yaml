{{- $name := default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $fullname := .Values.fullnameOverride | default (printf "%s-%s" .Release.Name $name) | trunc 63 | trimSuffix "-" }}
{{- $chartLabel := printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- $feFullname := printf "%s-fe" $fullname | trunc 63 | trimSuffix "-" }}
{{- $beFullname := printf "%s-be" $fullname | trunc 63 | trimSuffix "-" }}
{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $beFullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "be" | toYaml | nindent 4 }}
  {{- with .Values.be.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.be.service.type }}
  ports:
    - port: {{ .Values.be.service.port }}
      targetPort: rpc
      protocol: TCP
      name: rpc
    - port: {{ .Values.be.service.webServerPort }}
      targetPort: web
      protocol: TCP
      name: web
    - port: {{ .Values.be.service.heartbeatPort }}
      targetPort: heartbeat
      protocol: TCP
      name: heartbeat
  clusterIP: None
  selector:
    {{- dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "component" "be" | toYaml | nindent 4 }}
{{- end }}
