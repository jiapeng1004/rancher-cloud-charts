# Doris chart values

# Enable/disable the chart
enabled: true

# Image settings
image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/doris
  tag: 1.2.8
  pullPolicy: IfNotPresent

# FE settings（勿重复顶层 fe:/be:，后者会覆盖前者导致 service.port 为空）
fe:
  service:
    type: ClusterIP
    port: 8030
    httpPort: 8031
    queryPort: 9030
  replicas: 1
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  nodeSelector:
    # Match nodes with disk type label (example)
    # disktype: ssd
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - ""
  tolerations:
    # Tolerate master node taint (uncomment if needed)
    # - key: node-role.kubernetes.io/master
    #   operator: Exists
    #   effect: NoSchedule
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

# BE settings（同上，service 与 replicas 等同一大键）
be:
  service:
    type: ClusterIP
    port: 9060
    webServerPort: 8040
    heartbeatPort: 9050
  replicas: 1
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  nodeSelector:
    # Match nodes with disk type label (example)
    # disktype: ssd
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: In
                values:
                  - ""
  tolerations:
    # Tolerate master node taint (uncomment if needed)
    # - key: node-role.kubernetes.io/master
    #   operator: Exists
    #   effect: NoSchedule
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

# Kubernetes compatibility settings
compatibility:
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: doris.example.com
      paths:
        - path: /
          pathType: Prefix
