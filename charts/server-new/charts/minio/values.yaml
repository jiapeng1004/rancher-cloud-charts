image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio
  tag: RELEASE.2024-01-10T00-54-08Z
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 9000
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30900
  
# Console service configuration
consoleService:
  type: ClusterIP
  port: 9001
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30901

# MinIO configuration
minio:
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  defaultBucket: "default"
  # Additional MinIO configuration options
  extraArgs:
    - --console-address=:9001
    # MinIO 2024 specific configuration
    - --metadata-heatmap
    - --metadata-heatmap-bucket=minio-metadata

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  # hostPath: /var/lib/minio

# Resources configuration
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1"

# Node selector configuration
nodeSelector:
  # Match nodes with disk type label (example)
  # disktype: ssd

# Affinity configuration
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - ""
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
                app.kubernetes.io/name: minio
                app.kubernetes.io/instance: minio
          topologyKey: "kubernetes.io/hostname"

# Tolerations configuration
tolerations:
  # Tolerate master node taint (uncomment if needed)
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule

# Pod security context configuration
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context configuration
securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# Kubernetes compatibility settings
compatibility:
  # Use ingress v1 or v1beta1 based on k8s version
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration for API
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: minio.example.com
      paths:
        - path: /
          pathType: Prefix

# Ingress configuration for Console
consoleIngress:
  enabled: false
  className: "nginx"
  hosts:
    - host: minio-console.example.com
      paths:
        - path: /
          pathType: Prefix
