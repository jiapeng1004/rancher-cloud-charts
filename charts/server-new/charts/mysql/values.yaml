image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql
  tag: 5.7.39
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 3306
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30306

# MySQL configuration
mysql:
  rootPassword: "123456"
  database: "mysql"
  username: "mysql"
  password: "mysql"
  # Additional MySQL configuration options
  extraConfig:
    bind-address: "0.0.0.0"
    max_connections: "1000"

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  # hostPath: /var/lib/mysql

# Resources configuration
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1"

# Node selector configuration
nodeSelector:
  # Match nodes with disk type label (example)
  # disktype: ssd

# Affinity configuration
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - ""
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
                app.kubernetes.io/name: mysql
                app.kubernetes.io/instance: mysql
          topologyKey: "kubernetes.io/hostname"

# Tolerations configuration
tolerations:
  # Tolerate master node taint (uncomment if needed)
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule

# Pod security context configuration
podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

# Container security context configuration
securityContext:
  runAsUser: 999
  runAsGroup: 999

# Kubernetes compatibility settings
compatibility:
  # Use ingress v1 or v1beta1 based on k8s version
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration (optional)
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: mysql.example.com
      paths:
        - path: /
          pathType: Prefix
