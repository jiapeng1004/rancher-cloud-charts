annotations:
  catalog.cattle.io/release-name: server
apiVersion: v2
name: server
version: 1.0.10
icon: https://cdn.jsdelivr.net/gh/devicons/devicon@v2.17.0/icons/docker/docker-original.svg
appVersion: "1.0"
description: A composite Helm chart for common server components (MySQL, Redis, MinIO)
type: application
keywords:
  - server
  - mysql
  - redis
  - minio
  - composite
home: https://example.com/
sources:
  - https://github.com/your-repo/rancher-cloud-charts
maintainers:
  - name: 贾鹏
    email: jiapeng_aoa@126.com

# Dependencies - Self-contained charts (only basic services)
dependencies:
  - name: mysql
    version: "5.7.0"
    repository: "file://charts/mysql"
    condition: mysql.enabled
  - name: redis
    version: "7.0.0"
    repository: "file://charts/redis"
    condition: redis.enabled
  - name: minio
    version: "RELEASE.2023-06-19T18-23-48Z"
    repository: "file://charts/minio"
    condition: minio.enabled
  - name: doris
    version: "2.0.0"
    repository: "file://charts/doris"
    condition: doris.enabled