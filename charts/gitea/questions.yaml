## 自动生成 / 或由 sync_rancher_questions.py 维护；与 values.yaml 常见字段对齐。高级项请直接在 Rancher 「编辑 YAML」中补充。
categories:
- gitea
questions:
- variable: image.repository
  type: string
  label: 镜像仓库
  description: 容器镜像仓库地址
  group: 镜像
  default: gitea/gitea
  required: true
- variable: image.tag
  type: string
  label: 镜像标签
  description: 镜像 tag
  group: 镜像
  default: 1.21.0
  required: true
- variable: image.pullPolicy
  type: enum
  label: 镜像拉取策略
  description: Kubernetes imagePullPolicy
  group: 镜像
  default: IfNotPresent
  required: true
  options:
  - IfNotPresent
  - Always
  - Never
- variable: service.type
  type: enum
  label: Service 类型
  description: Kubernetes Service.type
  group: 服务
  default: ClusterIP
  required: true
  options:
  - ClusterIP
  - NodePort
  - LoadBalancer
- variable: service.httpPort
  type: int
  label: Service 端口 (httpPort)
  description: 读写 service.httpPort
  group: 服务
  default: 3000
  required: true
- variable: persistence.enabled
  type: boolean
  label: 启用持久卷
  description: 若为 true，使用 PVC 持久化数据
  group: 持久化
  default: true
  required: false
- variable: persistence.size
  type: string
  label: PVC 容量
  description: Kubernetes 请求的存储大小（如 10Gi）
  group: 持久化
  default: 10Gi
  required: false
  show_if: persistence.enabled=true
