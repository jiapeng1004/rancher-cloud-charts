## 自动生成 / 或由 sync_rancher_questions.py 维护；与 values.yaml 常见字段对齐。高级项请直接在 Rancher 「编辑 YAML」中补充。
categories:
- wordpress site
questions:
- variable: replicaCount
  type: int
  label: 副本数
  description: Deployment 副本数量
  group: 通用
  default: 1
  required: true
- variable: image.repository
  type: string
  label: 镜像仓库
  description: 容器镜像仓库地址
  group: 镜像
  default: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/wordpress
  required: true
- variable: image.tag
  type: string
  label: 镜像标签
  description: 镜像 tag
  group: 镜像
  default: php8.2-apache
  required: true
- variable: image.pullPolicy
  type: enum
  label: 镜像拉取策略
  description: Kubernetes imagePullPolicy
  group: 镜像
  default: IfNotPresent
  required: true
  options:
  - IfNotPresent
  - Always
  - Never
- variable: service.port
  type: int
  label: Service 端口 (port)
  description: 读写 service.port
  group: 服务
  default: 80
  required: true
- variable: ingress.enabled
  type: boolean
  label: 启用 Ingress
  description: 若为 true，将渲染 Ingress（具体 hosts/tls 可在 YAML 中编辑）
  group: Ingress
  default: false
  required: false
- variable: ingress.className
  type: string
  label: IngressClass 名称
  description: Ingress 使用的 ingressClassName
  group: Ingress
  default: nginx
  required: false
  show_if: ingress.enabled=true
- variable: persistence.enabled
  type: boolean
  label: 启用持久卷
  description: 若为 true，使用 PVC 持久化数据
  group: 持久化
  default: true
  required: false
- variable: persistence.size
  type: string
  label: PVC 容量
  description: Kubernetes 请求的存储大小（如 10Gi）
  group: 持久化
  default: 10Gi
  required: false
  show_if: persistence.enabled=true
- variable: wordpress.db.host
  type: string
  label: WordPress DB 主机
  description: MySQL/PG Hostname 或集群内 DNS
  group: WordPress（数据库连接）
  default: mysql.middleware.svc.cluster.local
  required: true
- variable: wordpress.db.name
  type: string
  label: WordPress DB 名称
  description: 数据库名
  group: WordPress（数据库连接）
  default: wordpress
  required: true
- variable: wordpress.db.user
  type: string
  label: WordPress DB 用户名
  description: 数据库用户
  group: WordPress（数据库连接）
  default: wordpress
  required: true
- variable: wordpress.db.password
  type: password
  label: WordPress DB 密码
  description: 数据库密码（安装后请及时修改）
  group: WordPress（数据库连接）
  default: wordpress-change-me
  required: true
