## 自动生成 / 或由 sync_rancher_questions.py 维护；与 values.yaml 常见字段对齐。高级项请直接在 Rancher 「编辑 YAML」中补充。
categories:
- hadoop dev
questions:
- variable: rancherUiNote
  type: string
  label: 表单说明（本 Chart 可选 values 很少）
  description: 自动生成占位表单项；可随时编辑或忽略。
  group: 文档
  default: 请在 Rancher 「编辑 Helm」中用 YAML 直接调整；或通过独立 values.yaml 传入。
  required: false
