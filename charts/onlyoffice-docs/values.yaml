replicaCount: 1

image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/onlyoffice/documentserver
  tag: "8.0.1"
  pullPolicy: IfNotPresent

jwt:
  enabled: false
  secret: "change-this-jwt-secret"

service:
  port: 80
  containerPort: 80

persistence:
  enabled: false
  size: 20Gi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: onlyoffice.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    memory: 2Gi
