image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio
  tag: RELEASE.2023-06-09T07-32-12Z
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 9000
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30900
  
# Console service configuration
consoleService:
  type: ClusterIP
  port: 9001
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30901

# MinIO configuration
minio:
  accessKey: "minioadmin"
  secretKey: "minioadmin"
  defaultBucket: "default"
  # Additional MinIO configuration options
  extraArgs:
    - --console-address=:9001

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  # hostPath: /var/lib/minio

# Resources configuration
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "2Gi"
    cpu: "1"

# Kubernetes compatibility settings
compatibility:
  # Use ingress v1 or v1beta1 based on k8s version
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration for API
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: minio.example.com
      paths:
        - path: /
          pathType: Prefix

# Ingress configuration for Console
consoleIngress:
  enabled: false
  className: "nginx"
  hosts:
    - host: minio-console.example.com
      paths:
        - path: /
          pathType: Prefix
