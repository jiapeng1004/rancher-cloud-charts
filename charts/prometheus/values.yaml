image:
  repository: prom/prometheus
  tag: v2.45.0
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 9090
  # For NodePort or LoadBalancer, specify nodePort
  # nodePort: 30909

# Prometheus configuration
prometheus:
  # Additional Prometheus configuration options
  config:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

# Persistence configuration
persistence:
  enabled: true
  # storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  # hostPath: /var/lib/prometheus

# Resources configuration
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1"

# Node selector configuration
nodeSelector:
  # Match nodes with disk type label (example)
  # disktype: ssd

# Affinity configuration
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: In
              values:
                - ""
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: prometheus
          topologyKey: "kubernetes.io/hostname"

# Tolerations configuration
tolerations:
  # Tolerate master node taint (uncomment if needed)
  # - key: node-role.kubernetes.io/master
  #   operator: Exists
  #   effect: NoSchedule

# Pod security context configuration
podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# Container security context configuration
securityContext:
  runAsUser: 65534
  runAsGroup: 65534

# Kubernetes compatibility settings
compatibility:
  ingressApiVersion: "networking.k8s.io/v1"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: prometheus.example.com
      paths:
        - path: /
          pathType: Prefix
