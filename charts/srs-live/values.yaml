replicaCount: 1

image:
  repository: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ossrs/srs
  tag: "5"
  pullPolicy: IfNotPresent

# 若在 Pod 内需覆盖 SRS Docker 镜像行为，可加环境变量（视镜像脚本支持而定）
extraEnv:
  []

# SRS 二进制工作目录通常为 /usr/local/srs ，启动时用 -c 指向挂载的配置文件
workerDir: "/usr/local/srs"
args:
  - "objs/srs"
  - "-c"
  - "conf/srs-kubernetes.conf"

# 音视频 UDP/WebRTC 在部分网络下建议使用 hostNetwork 或 DaemonSet（请自行权衡安全与端口冲突）
hostNetwork: false

service:
  type: ClusterIP
  annotations: {}
  # RTMP / HTTP(Web/HLS/API) — 按需补充 NodePort ports
  ports:
    rtmp: 1935
    httpApi: 1985
    httpServer: 8080
    # SRS WebRTC 信令 udp/twcc 端口等见官方文档；按需打开并配合 hostNetwork/Ingress udp
    rtcSignal: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # 默认只转发 HTTP/HLS/Web 控制台等（RTMP/WebRTC UDP 无法用普通 Ingress）
  backendPort: httpServer
  hosts:
    - host: srs.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# 配置正文见 templates/configmap.yaml；复杂场景建议改为挂载 Secret 或由 CI 生成 ConfigMap。
srsConfig:
  rtcEnabled: false
  # SRS `candidate` 常需填集群外可达 IP；留空则用下面字面量 `*`（仅 Demo）
  rtcCandidate: "*"
