# K3s 单节点 — 默认华为云 SWR 镜像；Pod 拉取走内联 registries mirror
configs:
  k3s-registries:
    content: |
      mirrors:
        docker.io:
          endpoint:
            - "https://swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"
        registry-1.docker.io:
          endpoint:
            - "https://swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io"

services:
  k3s-server:
    image: ${K3S_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rancher/k3s:v1.31.5-k3s1}
    container_name: k3s-server
    hostname: k3s-server
    privileged: true
    restart: unless-stopped
    command:
      - server
      - --tls-san=127.0.0.1
      - --tls-san=localhost
      - --tls-san=k3s-server
      - --disable=traefik
      - --write-kubeconfig-mode=644
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_TOKEN: ${K3S_TOKEN:-local-dev-token}
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
      TZ: Asia/Shanghai
    ports:
      - "${K3S_API_PORT:-6443}:6443"
      - "${K3S_HTTP_PORT:-8088}:80"
      - "${K3S_HTTPS_PORT:-8443}:443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./output:/output
    configs:
      - source: k3s-registries
        target: /etc/rancher/k3s/registries.yaml
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kubectl --kubeconfig /output/kubeconfig.yaml get --raw /readyz >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  k3s-data:
    name: k3s-server-data

networks:
  app:
    name: app
    driver: bridge
