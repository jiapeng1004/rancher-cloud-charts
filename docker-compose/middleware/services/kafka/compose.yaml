# KRaft 单节点（Apache Kafka Native，无 ZooKeeper）
services:
  kafka:
    image: ${KAFKA_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/apache/kafka-native:4.0.0}
    container_name: mw-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      TZ: Asia/Shanghai
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - middleware
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

volumes:
  kafka-data:
    name: mw-kafka-data

networks:
  middleware:
    name: app
    driver: bridge
