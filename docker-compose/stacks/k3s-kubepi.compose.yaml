# K3s + KubePi（飞致云）联合套件
name: k3s-kubepi

include:
  - path: ../k3s/compose.yaml
  - path: ../kubepi/compose.yaml

services:
  kubepi-kubeconfig:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/alpine:3.20.3
    container_name: kubepi-kubeconfig-init
    depends_on:
      k3s-server:
        condition: service_healthy
    volumes:
      - ../k3s/output:/output
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          [ -f /output/kubeconfig.yaml ] && break
          sleep 2
        done
        [ -f /output/kubeconfig.yaml ] || { echo "kubeconfig.yaml not found"; exit 1; }
        sed 's|https://127.0.0.1:6443|https://k3s-server:6443|g' /output/kubeconfig.yaml > /output/kubepi-kubeconfig.yaml
        echo "wrote /output/kubepi-kubeconfig.yaml (server=https://k3s-server:6443)"
    restart: "no"
    networks:
      - app

  kubepi-import:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/alpine:3.20.3
    container_name: kubepi-import-init
    depends_on:
      kubepi-kubeconfig:
        condition: service_completed_successfully
      kubepi:
        condition: service_healthy
    volumes:
      - ../k3s/output:/output:ro
      - ../kubepi/scripts:/scripts:ro
    environment:
      CLUSTER_NAME: ${KUBEPI_CLUSTER_NAME:-k3s-local}
      KUBEPI_USER: ${KUBEPI_USER:-admin}
      KUBEPI_PASS: ${KUBEPI_PASS:-kubepi}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/\r$$//' /scripts/import-k3s.sh | sh
    restart: "no"
    networks:
      - app
