# K3s + Kuboard 联合套件
name: k3s-kuboard

include:
  - path: ../k3s/compose.yaml
  - path: ../kuboard/compose.yaml

services:
  # 将 k3s 输出的 kubeconfig 改写为 Kuboard 容器内可访问的 API 地址
  kuboard-kubeconfig:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/alpine:3.20.3
    container_name: kuboard-kubeconfig-init
    depends_on:
      k3s-server:
        condition: service_healthy
    volumes:
      - ../k3s/output:/output
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          [ -f /output/kubeconfig.yaml ] && break
          sleep 2
        done
        [ -f /output/kubeconfig.yaml ] || { echo "kubeconfig.yaml not found"; exit 1; }
        sed 's|https://127.0.0.1:6443|https://k3s-server:6443|g' /output/kubeconfig.yaml > /output/kuboard-kubeconfig.yaml
        echo "wrote /output/kuboard-kubeconfig.yaml (server=https://k3s-server:6443)"
    restart: "no"
    networks:
      - app
